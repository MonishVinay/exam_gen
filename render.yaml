services:
  - type: web
    name: proctor-exam-platform
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TEACHER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
